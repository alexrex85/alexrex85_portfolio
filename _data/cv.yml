    Projects:
      - name: Database of Latin Nominal Compounds
        summary: This graph database aims to investigate the relationships between the types of nominal compounds and the literary genres in which they are attested, in order to gain a deeper understanding of the subtle interconnections between linguistics and literature.
        highlights:
          - Latin language and literature
          - Computational linguistics
        start_date: 2011
        end_date: 2026

      - name: The Latin Hymnarium
        summary: This database contains a collection of ancient ecclesiastical hymns. It aims to cover an increasing number of western liturgical traditions, especially the Roman and Ambrosian ones.
        highlights:
          - Late antique and medieval Latin literature
          - Liturgical and musical sciences
          - Computational linguistics
        start_date: 2024
        end_date: 2026

